[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrag"
version = "0.1.0"
description = "Local RAG search and answer system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "rich>=13.0",
]

[project.scripts]
pyrag = "ai_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_rag"]
